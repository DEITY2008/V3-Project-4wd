-shadow:0 0 3vmin rgba(255,120,130,.3)}\n.moon:after{content:\"\";position:absolute;inset:0;border-radius:50%;background:radial-gradient(circle at 30% 26%,transparent 30%,rgba(8,0,4,.72) 90%)}\n.dk{position:absolute;border-radius:50%;background:radial-gradient(circle at 32% 30%,#7a2036,#2a0812 70%);box-shadow:0 0 3vmin rgba(255,60,80,.22)}\n/* warp flash + label */\n#fl{position:fixed;inset:0;z-index:12;pointer-events:none;opacity:0;background:radial-gradient(circle at 50% 50%,rgba(255,225,215,.55),rgba(255,90,110,.35) 38%,transparent 74%)}\n#fl.go{animation:fh 1.25s ease-in-out}\n@keyframes fh{0%{opacity:0}48%{opacity:.5}100%{opacity:0}}\n#wl{position:fixed;left:0;right:0;top:50%;z-index:13;pointer-events:none;text-align:center;opacity:0;transform:translateY(-50%)}\n#wl small{display:block;font-size:12px;letter-spacing:.34em;color:#ffd1d8}\n#wl b{display:block;font-size:clamp(26px,9vh,48px);letter-spacing:.2em;margin-top:6px;text-shadow:0 0 28px rgba(255,80,110,.9)}\n#wl.go{animation:wl 1.25s ease-in-out}\n@keyframes wl{0%{opacity:0;transform:translateY(-50%) scale(.85)}35%,65%{opacity:1;transform:translateY(-50%) scale(1)}100%{opacity:0;transform:translateY(-50%) scale(1.15)}}\n/* ---------- panels (no backdrop-filter: that was the flicker source) ---------- */\n.g{background:linear-gradient(145deg,rgba(64,18,34,.80),rgba(24,6,16,.88));border:1px solid rgba(255,120,140,.28);box-shadow:inset 0 1px 0 rgba(255,205,210,.22),0 14px 34px rgba(0,0,0,.45),0 0 22px rgba(255,60,90,.12)}\n#app{position:relative;z-index:1;height:100%;overflow:hidden;--en:.7;--ex:1.4}\n#app[data-d=b]{--en:1.4;--ex:.7}\n.scr{position:absolute;inset:0;display:flex;opacity:0;visibility:hidden;pointer-events:none;transform:scale(var(--en));will-change:transform,opacity;transition:opacity .4s ease,transform .5s cubic-bezier(.5,0,.8,.4),visibility 0s .5s}\n.scr.pre{transition:none}\n.scr.on{opacity:1;visibility:visible;pointer-events:auto;transform:none;transition:opacity .6s .3s ease,transform .8s .25s cubic-bezier(.15,.8,.25,1)}\n.scr.out{transform:scale(var(--ex))}\n.pl{padding:10px 18px;border-radius:16px;background:rgba(255,255,255,.09);border:1px solid rgba(255,140,150,.3);transition:transform .12s ease,background-color .15s}\n.pl.hi,.pl.on{background:var(--grad);color:#1c0409;border:0}\n.pl:active,.ib:active,.adm:active{transform:scale(.93)}\n.ib{width:42px;height:42px;border-radius:15px;background:rgba(255,255,255,.09);border:1px solid rgba(255,140,150,.3);font-size:18px;transition:transform .12s ease}\n#con{display:grid;grid-template-columns:1.12fr 1fr;gap:8px;padding:12px 22px 16px;box-sizing:border-box}\n.stage{position:relative;min-height:0;display:grid;place-items:center}\n.orb{position:absolute;width:86%;aspect-ratio:1;max-height:96%;border-radius:50%;background:radial-gradient(circle,rgba(255,80,100,.30),rgba(255,140,60,.12) 45%,transparent 68%);animation:pu 4s ease-in-out infinite alternate;will-change:transform,opacity}\n@keyframes pu{to{transform:scale(1.1);opacity:.7}}\n.ring3{position:absolute;height:88%;aspect-ratio:1;border-radius:50%;background:conic-gradient(from 0deg,transparent,rgba(255,90,110,.85),transparent 30%,rgba(255,170,70,.85) 55%,transparent 80%);-webkit-mask:radial-gradient(circle,transparent 66%,#000 67%,#000 68.5%,transparent 69.5%);mask:radial-gradient(circle,transparent 66%,#000 67%,#000 68.5%,transparent 69.5%);animation:sp 9s linear infinite;will-change:transform}\n@keyframes sp{to{transform:rotate(360deg)}}\n.plat{position:absolute;bottom:6%;width:70%;height:12%;border-radius:50%;background:radial-gradient(ellipse,rgba(255,80,90,.55),transparent 68%)}\n.car3{position:relative;width:88%;max-height:88%;object-fit:contain;animation:fl2 5s ease-in-out infinite alternate;will-change:transform}\n@keyframes fl2{from{transform:translate3d(0,4px,0) rotate(-.6deg)}to{transform:translate3d(0,-8px,0) rotate(.6deg)}}\n.info{display:flex;flex-direction:column;justify-content:space-between;align-items:flex-end;text-align:right;min-h