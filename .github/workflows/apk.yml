{"name": "Build APK", "jobs": {"build": {"runs-on": "ubuntu-latest", "steps": [{"uses": "actions/setup-java@v4", "with": {"distribution": "temurin", "java-version": "17"}}, {"uses": "gradle/actions/setup-gradle@v4", "with": {"gradle-version": "8.9"}}, {"name": "Write project files", "run": "mkdir -p src/main/java/com/rc/car src/main/assets\ncat > settings.gradle <<'EOF'\npluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }\ndependencyResolutionManagement { repositories { google(); mavenCentral() } }\nrootProject.name = \"RcCar\"\nEOF\ncat > build.gradle <<'EOF'\nplugins { id 'com.android.application' version '8.5.2' }\nandroid {\n  namespace 'com.rc.car'\n  compileSdk 34\n  defaultConfig { applicationId 'com.rc.car'; minSdk 24; targetSdk 34; versionCode 1; versionName '1.0' }\n  compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }\n}\nEOF\ncat > src/main/AndroidManifest.xml <<'EOF'\n<manifest xmlns:android=\"http://schemas.android.com/apk/res/android\">\n  <uses-permission android:name=\"android.permission.BLUETOOTH\" android:maxSdkVersion=\"30\"/>\n  <uses-permission android:name=\"android.permission.BLUETOOTH_CONNECT\"/>\n  <application android:label=\"RC 4WD\" android:theme=\"@android:style/Theme.DeviceDefault.NoActionBar.Fullscreen\">\n    <activity android:name=\".MainActivity\" android:exported=\"true\" android:screenOrientation=\"sensorLandscape\" android:configChanges=\"orientation|screenSize|keyboardHidden\">\n      <intent-filter>\n        <action android:name=\"android.intent.action.MAIN\"/>\n        <category android:name=\"android.intent.category.LAUNCHER\"/>\n      </intent-filter>\n    </activity>\n  </application>\n</manifest>\nEOF\ncat > src/main/java/com/rc/car/MainActivity.java <<'EOF'\npackage com.rc.car;\n\nimport android.Manifest;\nimport android.app.Activity;\nimport android.bluetooth.BluetoothAdapter;\nimport android.bluetooth.BluetoothDevice;\nimport android.bluetooth.BluetoothSocket;\nimport android.content.pm.PackageManager;\nimport android.os.Build;\nimport android.os.Bundle;\nimport android.view.View;\nimport android.view.WindowManager;\nimport android.webkit.JavascriptInterface;\nimport android.webkit.WebSettings;\nimport android.webkit.WebView;\nimport java.io.OutputStream;\nimport java.util.UUID;\n\npublic class MainActivity extends Activity {\n  WebView web;\n  BluetoothSocket sock;\n  OutputStream out;\n  static final UUID SPP = UUID.fromString(\"00001101-0000-1000-8000-00805F9B34FB\");\n\n  @Override protected void onCreate(Bundle b) {\n    super.onCreate(b);\n    getWindow().addFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON);\n    if (Build.VERSION.SDK_INT >= 28)\n      getWindow().getAttributes().layoutInDisplayCutoutMode = WindowManager.LayoutParams.LAYOUT_IN_DISPLAY_CUTOUT_MODE_SHORT_EDGES;\n    web = new WebView(this);\n    WebSettings s = web.getSettings();\n    s.setJavaScriptEnabled(true);\n    s.setDomStorageEnabled(true);\n    web.setBackgroundColor(0xFF060A14);\n    web.addJavascriptInterface(new Bridge(), \"Android\");\n    setContentView(web);\n    web.loadUrl(\"file:///android_asset/index.html\");\n    if (Build.VERSION.SDK_INT >= 31 && checkSelfPermission(Manifest.permission.BLUETOOTH_CONNECT) != PackageManager.PERMISSION_GRANTED)\n      requestPermissions(new String[]{Manifest.permission.BLUETOOTH_CONNECT}, 1);\n  }\n\n  @Override public void onWindowFocusChanged(boolean f) {\n    super.onWindowFocusChanged(f);\n    if (f) getWindow().getDecorView().setSystemUiVisibility(View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY | View.SYSTEM_UI_FLAG_FULLSCREEN\n        | View.SYSTEM_UI_FLAG_HIDE_NAVIGATION | View.SYSTEM_UI_FLAG_LAYOUT_STABLE | View.SYSTEM_UI_FLAG_LAYOUT_FULLSCREEN\n        | View.SYSTEM_UI_FLAG_LAYOUT_HIDE_NAVIGATION);\n  }\n\n  void js(final String c) { runOnUiThread(() -> web.evaluateJavascript(c, null)); }\n\n  synchronized void drop() {\n    try { if (sock != null) sock.close(); } catch (Exception e) {}\n    sock = null; out = null;\n    js(\"onBt(false)\");\n  }\n\n  @Override public void onBackPressed() {\n    web.evaluateJavascript(\"window.onBack?window.onBack():false\", v -> { if (!\"true\".equals(v)) finish(); });\n  }\n\n  @Override protected void onDestroy() {\n    super.onDestroy();\n    try { if (sock != null) sock.close(); } catch (Exception e) {}\n  }\n\n  class Bridge {\n    @JavascriptInterface public String devices() {\n      try {\n        StringBuilder sb = new StringBuilder();\n        for (BluetoothDevice d : BluetoothAdapter.getDefaultAdapter().getBondedDevices()) {\n          String n = d.getName(); if (n == null || n.isEmpty()) n = d.getAddress();\n          sb.append(n.replace('|', ' ')).append('|').append(d.getAddress()).append('\\n');\n        }\n        return sb.toString();\n      } catch (Exception e) { return \"\"; }\n    }\n    @JavascriptInterface public void connect(final String addr) {\n      new Thread(() -> {\n        try {\n          BluetoothDevice d = BluetoothAdapter.getDefaultAdapter().getRemoteDevice(addr);\n          BluetoothSocket x = d.createRfcommSocketToServiceRecord(SPP);\n          x.connect();\n          sock = x; out = x.getOutputStream();\n          js(\"onBt(true)\");\n        } catch (Exception e) { drop(); }\n      }).start();\n    }\n    @JavascriptInterface public synchronized void send(String t) {\n      try { if (out != null) { out.write(t.getBytes()); out.flush(); } } catch (Exception e) { drop(); }\n    }\n    @JavascriptInterface public void close() { drop(); }\n  }\n}\nEOF\ncat > src/main/assets/index.html <<'EOF'\n<!DOCTYPE html>\n<html lang=\"th\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1, viewport-fit=cover\">\n<title>RC 4WD</title>\n<style>\n:root{--bg:#07020a;--tx:#fff1f2;--mut:#caa0ac;--a:#ff4d6a;--b:#ffa13d;--ok:#46f0b0;--rev:#b98cff;--bad:#ff2a4d;--grad:linear-gradient(135deg,#ff4d6a,#ffa13d);color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}\nhtml{scroll-padding-top:env(safe-area-inset-top,0px)}\nhtml,body{height:100%;margin:0;background:var(--bg)}\nbody{color:var(--tx);font:800 15px/1.25 ui-rounded,\"SF Pro Rounded\",\"Varela Round\",Nunito,system-ui,-apple-system,\"Segoe UI\",Roboto,\"Noto Sans Thai\",sans-serif;overflow:hidden;overscroll-behavior:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}\nbutton{font:inherit;color:inherit;border:0;cursor:pointer;touch-action:manipulation;outline:0;-webkit-appearance:none;appearance:none}\nimg{-webkit-user-drag:none;pointer-events:none}\n/* ---------- fixed space scene (background never changes) ---------- */\n#bg,#fx,#wp,#space,.vg{position:fixed;inset:0;width:100%;height:100%;pointer-events:none}\n#bg{background:\n radial-gradient(85% 70% at 16% 8%,rgba(200,28,66,.40),transparent 62%),\n radial-gradient(75% 65% at 90% 92%,rgba(255,96,40,.22),transparent 64%),\n radial-gradient(55% 45% at 72% 18%,rgba(130,20,120,.24),transparent 66%),\n radial-gradient(50% 40% at 30% 80%,rgba(160,20,60,.18),transparent 70%),\n linear-gradient(#14050c,#08020a 65%,#040107)}\n.vg{background:radial-gradient(ellipse at center,transparent 52%,rgba(0,0,0,.62))}\n#space{overflow:hidden;--i:0}\n#world,#far{position:absolute;inset:0;will-change:transform;transition:transform 1.25s cubic-bezier(.72,0,.2,1)}\n#world{transform:translate3d(calc(var(--i)*-130vw),0,0)}\n#far{transform:translate3d(calc(var(--i)*-46vw),0,0)}\n#space.go{animation:zm 1.25s cubic-bezier(.45,0,.3,1)}\n@keyframes zm{50%{transform:scale(1.1)}}\n.sec{position:absolute;top:0;bottom:0;width:100vw;left:calc(var(--k)*130vw)}\n.fs{position:absolute;top:0;bottom:0;width:100vw;left:calc(var(--k)*46vw)}\n.fd{position:absolute;border-radius:50%;background:radial-gradient(