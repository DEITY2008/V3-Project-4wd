an class=\"nb\">2</span><p>ESP32 \u0e23\u0e31\u0e1a\u0e04\u0e33\u0e2a\u0e31\u0e48\u0e07\u0e17\u0e34\u0e28\u0e17\u0e32\u0e07</p></div><div class=\"stp\"><span class=\"nb\">3</span><p>L298N \u0e02\u0e31\u0e1a\u0e21\u0e2d\u0e40\u0e15\u0e2d\u0e23\u0e4c\u0e17\u0e31\u0e49\u0e07 4 \u0e25\u0e49\u0e2d</p></div><p class=\"wn\">\u0e15\u0e23\u0e27\u0e08\u0e02\u0e31\u0e49\u0e27\u0e44\u0e1f\u0e41\u0e25\u0e30\u0e43\u0e0a\u0e49\u0e41\u0e1a\u0e15\u0e40\u0e15\u0e2d\u0e23\u0e35\u0e48 7.4V \u0e17\u0e35\u0e48\u0e40\u0e2b\u0e21\u0e32\u0e30\u0e2a\u0e21\u0e01\u0e48\u0e2d\u0e19\u0e40\u0e1b\u0e34\u0e14\u0e43\u0e0a\u0e49\u0e07\u0e32\u0e19\u0e17\u0e38\u0e01\u0e04\u0e23\u0e31\u0e49\u0e07</p></div>`);\n  $('#rail').innerHTML=c.join('');$('#rail').scrollLeft=0;\n}\n$('#eqb').onclick=()=>{buildEq();go('eq')};\n$('#eqx').onclick=()=>go('con');\n\n/* ---------- Android back button ---------- */\nwindow.onBack=()=>{\n  for(const id of ['#sh','#pn','#pop']){const o=$(id);if(o.classList.contains('on')){o.classList.remove('on');return true}}\n  if(cur==='eq'){go('con');return true}\n  if(cur==='drv'){toast('\u0e01\u0e14\u0e1b\u0e38\u0e48\u0e21 \u23cf \u0e40\u0e1e\u0e37\u0e48\u0e2d\u0e15\u0e31\u0e14\u0e01\u0e32\u0e23\u0e40\u0e0a\u0e37\u0e48\u0e2d\u0e21\u0e15\u0e48\u0e2d\u0e01\u0e48\u0e2d\u0e19\u0e2d\u0e2d\u0e01');return true}\n  return false;\n};\n</script>\n</body>\n</html>\n\nEOF\n"}, {"name": "Build", "run": "gradle assembleDebug --no-daemon"}, {"uses": "actions/upload-artifact@v4", "with": {"name": "RC-Car-APK", "path": "build/outputs/apk/debug/*.apk"}}]}}, "on": {"push": null, "workflow_dispatch": null}}
